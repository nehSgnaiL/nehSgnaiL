name: Refresh repository pins

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pins-${{ github.ref }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate pin cards
        run: python3 scripts/generate-pins.py
      - name: Commit refreshed cards
        run: |
          if git diff --quiet -- assets/pins; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pins
          git commit -m "chore(profile): refresh repository pin cards"
          git push
